services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contract_intelligence
      POSTGRES_USER: contract_os
      POSTGRES_PASSWORD: contract_os_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_os -d contract_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://contract_os:contract_os_dev@db:5432/contract_intelligence
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEMO_MODE: "false"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
